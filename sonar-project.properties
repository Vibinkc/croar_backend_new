# SonarQube scan config — Croar backend.
# Only the application source (app/) is analyzed; everything else is excluded so the scan
# focuses on the code that needs testing (no secrets, uploads, deps, scripts, or test scratch).
sonar.projectKey=croar-backend
sonar.projectName=Croar Backend
sonar.sources=app
sonar.python.version=3.13

# Belt-and-suspenders exclusions (anything outside app/ is already ignored by sonar.sources).
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  uploads/**,\
  venv/**,\
  scripts/**,\
  alembic/**,\
  **/migrations/**,\
  test_api_all.py,\
  conftest.py,\
  **/*.env,\
  .env*,\
  google_credentials.json

# Don't fail the whole scan if some generated/vendored file can't be parsed.
sonar.python.file.suffixes=.py
